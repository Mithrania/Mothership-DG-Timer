<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060807">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CRT Timer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>CRT Countdown Timer</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; overflow: hidden; background: #060807; color: #caffcc; font-family: "Courier New", Courier, monospace; }
    .cabinet { width: min(92vw, 760px); padding: clamp(18px, 4vw, 35px); border-radius: 42px; background: linear-gradient(145deg, #29302c, #090b0a 55%, #1c211e); box-shadow: 0 25px 70px #000, inset 1px 1px 2px #647068, inset -2px -2px 5px #000; }
    .screen { position: relative; overflow: hidden; min-height: 410px; padding: clamp(26px, 6vw, 54px) clamp(18px, 5vw, 46px); border: 8px solid #030504; border-radius: 48% / 10%; background: radial-gradient(ellipse at center, #123c1e 0%, #07180d 52%, #020403 100%); box-shadow: inset 0 0 55px #000, 0 0 0 3px #4b554e, 0 0 25px #101713; text-align: center; }
    .screen::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 3; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.28) 0 2px, rgba(120,255,150,.06) 3px 4px); mix-blend-mode: multiply; animation: roll 9s linear infinite; }
    .screen::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 4; background: radial-gradient(ellipse, transparent 42%, rgba(0,0,0,.34) 100%), linear-gradient(90deg, rgba(255,0,0,.025), transparent 45%, rgba(0,150,255,.025)); }
    @keyframes roll { to { background-position: 0 120px; } }
    .content { position: relative; z-index: 2; }.status { margin: 0 0 24px; font-size: clamp(.7rem, 2vw, .95rem); letter-spacing: .18em; color: #8dff9d; text-shadow: 0 0 8px #4dff6c; }
    .display { margin: 0 0 28px; font-size: clamp(3.4rem, 14vw, 7.8rem); font-weight: bold; line-height: 1; letter-spacing: -.07em; color: #d7ffca; text-shadow: -2px 0 #e75b5b, 2px 0 #5ed9e3, 0 0 7px #b4ffad, 0 0 24px #30dd56; font-variant-numeric: tabular-nums; }
    .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }button { min-width: 120px; padding: 12px 16px; border: 1px solid #85e98e; border-radius: 2px; cursor: pointer; background: rgba(12,65,27,.45); color: #caffcc; font: bold .9rem "Courier New", monospace; letter-spacing: .1em; box-shadow: 0 0 10px rgba(86,255,96,.28), inset 0 0 8px rgba(100,255,110,.12); transition: .15s ease; }
    button:hover, button:focus-visible { outline: none; background: #1d8132; box-shadow: 0 0 20px #54e667; transform: translateY(-1px); } button:active { transform: translateY(1px); }.hint { margin: 25px 0 0; font-size: .72rem; color: #82bd85; letter-spacing: .06em; }.cursor { display: inline-block; width: .65em; height: 1.05em; margin-left: .25em; vertical-align: -.15em; background: #a8ffa5; box-shadow: 0 0 9px #62ff64; animation: blink .9s steps(1) infinite; }@keyframes blink { 50% { opacity: 0; } }.finished .display { color: #ffb6a5; text-shadow: -2px 0 #ff3131, 2px 0 #eeea68, 0 0 20px #ff5733; animation: alarm .7s steps(2) infinite; }@keyframes alarm { 50% { opacity: .58; } }@media (max-width: 460px) { .screen { min-height: 380px; border-radius: 38% / 8%; } button { min-width: 102px; } }
  </style>
</head>
<body>
  <main class="cabinet"><section class="screen" aria-label="10-minute countdown timer"><div class="content"><p class="status" id="status">SYSTEM READY<span class="cursor" aria-hidden="true"></span></p><div class="display" id="display" role="timer" aria-live="polite">10:00</div><div class="controls"><button type="button" id="start">START</button><button type="button" id="pause">PAUSE</button><button type="button" id="reset">RESET</button></div><p class="hint"> MOROI TECHNOLOGIES // INITIALIZED</p></div></section></main>
  <script>
    const initialSeconds = 600; let secondsLeft = initialSeconds; let intervalId = null; let audioContext = null; let alarmId = null;
    const display = document.getElementById('display'), status = document.getElementById('status'), screen = document.querySelector('.screen');
    function render() { const minutes = Math.floor(secondsLeft / 60), seconds = secondsLeft % 60; display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`; document.title = `${display.textContent} — CRT Countdown Timer`; }
    function setStatus(text) { status.firstChild.nodeValue = text; }
    function getAudioContext() { if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)(); return audioContext; }
    function beep() { const context = getAudioContext(); if (context.state === 'suspended') context.resume(); const oscillator = context.createOscillator(), gain = context.createGain(); oscillator.type = 'square'; oscillator.frequency.value = 880; gain.gain.setValueAtTime(.0001, context.currentTime); gain.gain.exponentialRampToValueAtTime(.12, context.currentTime + .015); gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + .22); oscillator.connect(gain).connect(context.destination); oscillator.start(); oscillator.stop(context.currentTime + .23); }
    function startAlarm() { beep(); alarmId = window.setInterval(beep, 700); } function stopAlarm() { window.clearInterval(alarmId); alarmId = null; }
    function start() { if (intervalId || secondsLeft === 0) return; getAudioContext().resume(); setStatus('COUNTDOWN RUNNING'); intervalId = window.setInterval(() => { secondsLeft--; render(); if (secondsLeft === 0) { window.clearInterval(intervalId); intervalId = null; screen.classList.add('finished'); setStatus('TIME EXPIRED'); startAlarm(); } }, 1000); }
    function pause() { if (!intervalId) return; window.clearInterval(intervalId); intervalId = null; setStatus('COUNTDOWN PAUSED'); }
    function reset() { window.clearInterval(intervalId); intervalId = null; stopAlarm(); secondsLeft = initialSeconds; screen.classList.remove('finished'); render(); setStatus('SYSTEM READY'); }
    document.getElementById('start').addEventListener('click', start); document.getElementById('pause').addEventListener('click', pause); document.getElementById('reset').addEventListener('click', reset); if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js')); render();
  </script>
</body>
</html>
